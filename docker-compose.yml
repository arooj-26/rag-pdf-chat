services:
  qdrant:
    image: qdrant/qdrant:v1.15.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DEBUG: "false"
      QDRANT_URL: http://qdrant:6333
      QDRANT_PATH: ""
      DATABASE_URL: sqlite:////app/data/pdf_chat.db
      UPLOAD_DIR: /app/data/uploads
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app_data:/app/data
    depends_on:
      - qdrant
volumes:
  app_data:
  qdrant_data:
